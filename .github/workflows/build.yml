name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev pkg-config git python3

      - name: Build DevkitARM / Toolchain
        run: |
          # The make tools process or pre-built toolchain steps will execute here
          make tools

      - name: Compile ROM (HNS Target)
        run: |
          make hns -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokehns-rom
          path: poke-hns.gba
