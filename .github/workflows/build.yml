name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libpng-dev pkg-config git python3 zlib1g-dev

      - name: Install DevkitARM / ARM Toolchain
        run: |
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Fix Duplicate Map Section Declarations
        run: |
          python3 -c '
          path = "include/constants/region_map_sections.h"
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          seen = set()
          new_lines = []
          for line in lines:
              stripped = line.strip()
              skip = False
              for name in ["MAPSEC_ROCKET_HIDEOUT_HNS", "MAPSEC_MT_SILVER", "MAPSEC_NEW_SINJOH"]:
                  if stripped.startswith(name + ",") or stripped.startswith(name + " "):
                      if name in seen:
                          skip = True
                      else:
                          seen.add(name)
              if not skip:
                  new_lines.append(line)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(new_lines)
          '

      - name: Compile ROM (HNS Target)
        run: |
          make hns CFLAGS="-Wno-error=error -Wno-error=pedantic -Wno-error=shadow" -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokehns-rom
          path: pokehns.gba
